<div class="row">
  <div class="col-12">
    <nb-card>
      <nb-card-header>
        <div class="d-flex justify-content-between align-items-center">
          <!-- Left: Title | Cluster Name -->
          <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0">数据库管理</h5>
            <span class="text-hint">|</span>
            <span class="text-hint" style="font-size: 13px;">
              集群: <strong>{{ clusterName }}</strong>
            </span>
          </div>

          <!-- Right: Action Buttons -->
          <div class="d-flex align-items-center gap-2">
            <button nbButton
                    status="primary"
                    size="small"
                    (click)="loadDatabases()"
                    [disabled]="loading">
              <nb-icon icon="refresh-outline"></nb-icon>
              刷新
            </button>
            <button nbButton
                    status="success"
                    size="small"
                    (click)="openCreateDialog()">
              <nb-icon icon="plus-outline"></nb-icon>
              创建数据库
            </button>
          </div>
        </div>
      </nb-card-header>

      <nb-card-body>
        <!-- Loading Indicator -->
        <div *ngIf="loading" class="text-center">
          <nb-spinner status="primary"></nb-spinner>
        </div>

        <!-- Data Table -->
        <ng2-smart-table *ngIf="!loading"
                         [settings]="settings"
                         [source]="source"
                         (edit)="onEdit($event)"
                         (delete)="onDelete($event)">
        </ng2-smart-table>
      </nb-card-body>
    </nb-card>
  </div>
</div>

<!-- Create Dialog -->
<ng-template #createDialog let-data let-ref="dialogRef">
  <nb-card>
    <nb-card-header>
      <div class="d-flex justify-content-between align-items-center">
        <h5>创建数据库</h5>
        <button nbButton ghost (click)="closeCreateDialog()">
          <nb-icon icon="close-outline"></nb-icon>
        </button>
      </div>
    </nb-card-header>
    <nb-card-body>
      <div class="form-group">
        <label class="label">数据库名称 <span class="text-danger">*</span></label>
        <input nbInput
               fullWidth
               type="text"
               [(ngModel)]="newDatabase.name"
               placeholder="请输入数据库名称"
               [disabled]="creating" />
      </div>
      <div class="form-group mt-3">
        <label class="label">备注</label>
        <input nbInput
               fullWidth
               type="text"
               [(ngModel)]="newDatabase.comment"
               placeholder="请输入备注"
               [disabled]="creating" />
      </div>
    </nb-card-body>
    <nb-card-footer>
      <div class="d-flex justify-content-end gap-2">
        <button nbButton
                status="basic"
                (click)="closeCreateDialog()"
                [disabled]="creating">
          取消
        </button>
        <button nbButton
                status="primary"
                (click)="createDatabase()"
                [disabled]="creating || !newDatabase.name.trim()">
          <nb-icon icon="checkmark-outline"></nb-icon>
          {{ creating ? '创建中...' : '创建' }}
        </button>
      </div>
    </nb-card-footer>
  </nb-card>
</ng-template>

<!-- Edit Dialog -->
<ng-template #editDialog let-data let-ref="dialogRef">
  <nb-card *ngIf="currentDatabase">
    <nb-card-header>
      <div class="d-flex justify-content-between align-items-center">
        <h5>编辑数据库: {{ currentDatabase.name }}</h5>
        <button nbButton ghost (click)="closeEditDialog()">
          <nb-icon icon="close-outline"></nb-icon>
        </button>
      </div>
    </nb-card-header>
    <nb-card-body>
      <div class="form-group">
        <label class="label">数据库名称</label>
        <input nbInput
               fullWidth
               type="text"
               [value]="currentDatabase.name"
               disabled />
      </div>
      <div class="form-group mt-3">
        <label class="label">备注</label>
        <input nbInput
               fullWidth
               type="text"
               [(ngModel)]="currentDatabase.comment"
               placeholder="请输入备注" />
      </div>
    </nb-card-body>
    <nb-card-footer>
      <div class="d-flex justify-content-end gap-2">
        <button nbButton
                status="basic"
                (click)="closeEditDialog()"
                [disabled]="updating">
          取消
        </button>
        <button nbButton
                status="primary"
                (click)="updateDatabase()"
                [disabled]="updating">
          <nb-icon icon="checkmark-outline"></nb-icon>
          {{ updating ? '更新中...' : '更新' }}
        </button>
      </div>
    </nb-card-footer>
  </nb-card>
</ng-template>
